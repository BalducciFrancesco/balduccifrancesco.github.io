# Rebuilds the photo gallery whenever photos or album details are pushed:
# strips GPS data, makes thumbnails, updates gallery.json, and commits the result.
name: Build photo gallery

on:
  push:
    paths:
      - "photography/gallery/full/**"
      - "photography/gallery/albums.json"
      - "photography/build_gallery.py"
  workflow_dispatch:

permissions:
  contents: write

# one build per branch at a time, so two quick uploads don't race each other
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow and exiftool
        run: |
          pip install pillow
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl

      - name: Build gallery
        run: python3 photography/build_gallery.py

      - name: Commit changes
        run: |
          git add photography/gallery
          if git diff --cached --quiet; then
            echo "Gallery already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build photo gallery"
          # pick up anything pushed while this was running
          git pull --rebase
          git push
