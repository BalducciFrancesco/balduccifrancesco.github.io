# Prepares album covers whenever covers or albums.json are pushed: shrinks them,
# strips all metadata (including GPS), checks albums.json, and commits the result.
name: Prepare photo covers

on:
  push:
    paths:
      - "photography/gallery/covers/**"
      - "photography/gallery/albums.json"
      - "photography/prepare_covers.py"
  workflow_dispatch:

permissions:
  contents: write

# one run per branch at a time, so two quick uploads don't race each other
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Prepare covers
        run: python3 photography/prepare_covers.py

      - name: Commit changes
        run: |
          git add photography/gallery/covers
          if git diff --cached --quiet; then
            echo "Covers already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare photo covers"
          # pick up anything pushed while this was running
          git pull --rebase
          git push
